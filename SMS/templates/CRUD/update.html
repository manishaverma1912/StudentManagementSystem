<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Update form </h1>
    <h2>Are you sure you wnat to update {{ uu.name }}</h2>


    <form method="post">
        {% csrf_token %}
        <input type="text" name="name" id="" value="{{uu.name}}"  placeholder="name"><br>
        <input type="text" name="email" id="" value="{{uu.email}}" placeholder="email"><br>
        <input type="text" name="message" id="" value="{{uu.message}}" placeholder="message"><br><br>
    
    
        <button type="submit">Update</button>
        <a href="{% url 'reviewform' %}"> cancel</a>
    </form>


</body>
</html>
